stages:
  - test
  - register
  - deploy

variables:
  JULIA_PKG_USE_CLI_GIT: "true"

default:
  image: julia:1

.setup_julia: &setup_julia
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    # Use --add so both insteadOf patterns coexist; without it the second
    # `git config` silently replaces the first and the SSH rewrite is lost.
    - git config --global --add url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.qperfect.io/".insteadOf "git@gitlab.qperfect.io:"
    - git config --global --add url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.qperfect.io/".insteadOf "https://gitlab.qperfect.io/"
    - julia -e 'import Pkg; Pkg.update()'
    - julia -e 'import Pkg; Pkg.Registry.add(Pkg.RegistrySpec(url="https://gitlab.qperfect.io/julia/Registry.git"))'

test:
  stage: test
  <<: *setup_julia
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "devel"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - julia --project=. -e 'import Pkg; Pkg.instantiate(); Pkg.build()'
    - julia --project=. -e 'import Pkg; Pkg.test()'

register:
  stage: register
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/
  before_script:
    - apt-get update -qq && apt-get install -y -qq git openssh-client
    - eval $(ssh-agent -s)
    - cat "$PRIVATEREGISTRY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan gitlab.qperfect.io >> ~/.ssh/known_hosts
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.qperfect.io/".insteadOf "https://gitlab.qperfect.io/"
    - git config --global user.email "technical@qperfect.io"
    - git config --global user.name "QPerfect"
    - julia -e 'import Pkg; Pkg.update()'
    - julia -e 'import Pkg; Pkg.Registry.add(Pkg.RegistrySpec(url="git@gitlab.qperfect.io:julia/Registry.git"))'
  script:
    - |
      julia --color=yes -e '
        import Pkg
        Pkg.add("LocalRegistry")
        Pkg.develop(path="./")
        using LocalRegistry
        register("MimiqCircuitsBase", registry="QPerfectInternalRegistry",
                 repo="git@gitlab.qperfect.io:development/mimiq/MimiqCircuitsBase.jl.git")
      '

# Build the docs on devel and merge requests so a broken build fails
# the pipeline, but don't deploy anywhere — only `main` publishes to
# GitLab Pages (see the `pages` job below).
docs:
  stage: test
  <<: *setup_julia
  rules:
    - if: $CI_COMMIT_BRANCH == "devel"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - julia --project=docs -e 'import Pkg; Pkg.develop(Pkg.PackageSpec(path=pwd())); Pkg.instantiate()'
    - julia --project=docs docs/make.jl

pages:
  stage: deploy
  <<: *setup_julia
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - julia --project=docs -e 'import Pkg; Pkg.develop(Pkg.PackageSpec(path=pwd())); Pkg.instantiate()'
    - julia --project=docs docs/make.jl
    - mkdir -p public
    - cp -r docs/build/* public/
  artifacts:
    paths:
      - public
  publish: public
  environment:
    name: pages
    url: $CI_PAGES_URL
  resource_group: pages-deploy
